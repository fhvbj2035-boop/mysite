<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آیتوبیا | AYTOOBYA — همه‌چیز، همه‌جا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #6d28d9;
  --primary-2: #7c3aed;
  --gold: #fbbf24;
  --ink: #0a0a0f;
  --ink-soft: #1c1c24;
  --muted: #6b7280;
  --line-dark: #ececf1;
  --bg-soft: #f5f5f7;
}
html { scroll-behavior: smooth; }
body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #fff; color: #0a0a0f; line-height: 1.6; overflow-x: hidden; }

/* NAV */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(10,10,15,0.75); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); }
.nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.nav-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: white; }
.nav-logo-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #7c3aed, #4c1d95); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; color: white; letter-spacing: -1px; box-shadow: 0 4px 15px rgba(124,58,237,0.4); position: relative; }
.nav-logo-mark::after { content: ''; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
.nav-logo-text { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; }
.nav-logo-text span { color: #fbbf24; }
.nav-links { display: none; gap: 26px; }
.nav-links a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 13px; font-weight: 500; transition: color 0.2s; }
.nav-links a:hover { color: white; }
.nav-actions { display: flex; gap: 8px; align-items: center; }
.nav-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.85); text-decoration: none; border-radius: 10px; }
.nav-icon svg { width: 18px; height: 18px; }
.nav-cta { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: 700; }
.nav-user { display: none; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #7c3aed, #4c1d95); color: white; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; text-decoration: none; }

/* HERO */
.hero { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; padding: 100px 20px 80px; }
.hero-bg { position: absolute; inset: 0; background-image: url('https://picsum.photos/seed/aytoobyahero/1600/2000'); background-size: cover; background-position: center; opacity: 0.4; }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,15,0.6) 0%, rgba(10,10,15,0.4) 40%, rgba(10,10,15,0.98) 100%); }
.hero-content { position: relative; z-index: 2; text-align: center; max-width: 900px; }
.hero-eyebrow { display: inline-block; font-size: 12px; color: rgba(255,255,255,0.75); margin-bottom: 20px; font-weight: 600; letter-spacing: 1px; padding: 8px 18px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); border-radius: 30px; }
.hero-eyebrow .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; margin-left: 8px; vertical-align: middle; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.hero h1 { font-size: clamp(40px, 8vw, 88px); font-weight: 900; color: white; line-height: 1.02; letter-spacing: -3px; margin-bottom: 22px; }
.hero h1 .grad { background: linear-gradient(135deg, #a855f7 0%, #fbbf24 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero p { font-size: clamp(15px, 2.4vw, 20px); color: rgba(255,255,255,0.75); max-width: 620px; margin: 0 auto 34px; line-height: 1.75; }
.hero-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn-hero { display: inline-flex; align-items: center; gap: 8px; padding: 15px 30px; border-radius: 100px; font-size: 15px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; font-family: inherit; transition: all 0.25s; }
.btn-hero-fill { background: white; color: #000; }
.btn-hero-fill:hover { transform: scale(1.05); }
.btn-hero-line { background: transparent; color: white; border: 1.5px solid rgba(255,255,255,0.4); }
.btn-hero svg { width: 16px; height: 16px; }
.hero-scroll { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); animation: bounce 2s infinite; }
.hero-scroll svg { width: 24px; height: 24px; }
@keyframes bounce { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }

/* STATS */
.stats { background: var(--bg-soft); padding: 60px 20px; }
.stats-inner { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px 20px; text-align: center; }
.stat-num { font-size: clamp(32px, 6vw, 56px); font-weight: 900; letter-spacing: -2px; color: var(--primary); line-height: 1; }
.stat-num .unit { font-size: 0.5em; font-weight: 700; color: var(--ink); }
.stat-lbl { font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 500; }

/* SECTIONS */
.section { padding: 80px 20px; }
.section-dark { background: #000; color: white; }
.section-soft { background: var(--bg-soft); }
.section-inner { max-width: 1200px; margin: 0 auto; }
.section-head { text-align: center; margin-bottom: 50px; }
.section-eyebrow { font-size: 12px; font-weight: 700; color: var(--primary-2); letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; }
.section-dark .section-eyebrow { color: var(--gold); }
.section-title { font-size: clamp(28px, 5vw, 48px); font-weight: 900; letter-spacing: -1.5px; line-height: 1.15; margin-bottom: 14px; }
.section-title .grad { background: linear-gradient(135deg, #a855f7, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.section-dark .section-title .grad { background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.section-sub { font-size: 16px; color: var(--muted); max-width: 600px; margin: 0 auto; }
.section-dark .section-sub { color: rgba(255,255,255,0.6); }

/* FEATURED CARDS */
.featured-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
.feat-card { position: relative; border-radius: 24px; overflow: hidden; min-height: 480px; display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 32px; text-decoration: none; color: white; background: #111; }
.feat-card-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 0.6s; }
.feat-card:hover .feat-card-bg { transform: scale(1.05); }
.feat-card-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 25%, rgba(0,0,0,0.9) 100%); }
.feat-card-content { position: relative; z-index: 2; }
.feat-tag { display: inline-block; font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; }
.feat-title { font-size: clamp(24px, 4vw, 36px); font-weight: 900; letter-spacing: -1px; line-height: 1.15; margin-bottom: 10px; }
.feat-desc { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 22px; line-height: 1.7; }
.feat-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.feat-btn { display: inline-flex; align-items: center; gap: 6px; padding: 11px 22px; border-radius: 100px; font-size: 13px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; font-family: inherit; background: white; color: #000; }
.feat-btn svg { width: 14px; height: 14px; }

/* CATEGORIES */
.cats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.cat-tile { background: white; border-radius: 20px; padding: 24px 18px; text-decoration: none; color: var(--ink); transition: all 0.3s; border: 1px solid var(--line-dark); display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.cat-tile:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: transparent; }
.cat-tile-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
.cat-tile-icon svg { width: 24px; height: 24px; color: white; }
.cat-tile-title { font-size: 15px; font-weight: 800; }
.cat-tile-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.cat-tile-count { font-size: 11px; color: var(--primary-2); font-weight: 700; margin-top: auto; padding-top: 8px; }

/* PRODUCTS GRID */
.products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.prod-card { background: white; border-radius: 20px; overflow: hidden; text-decoration: none; color: var(--ink); transition: all 0.3s; border: 1px solid var(--line-dark); }
.prod-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
.prod-img { aspect-ratio: 1; overflow: hidden; position: relative; background: var(--bg-soft); }
.prod-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
.prod-card:hover .prod-img img { transform: scale(1.08); }
.prod-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); color: white; font-size: 10px; font-weight: 800; padding: 5px 11px; border-radius: 20px; }
.prod-body { padding: 16px; }
.prod-cat { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.prod-title { font-size: 14px; font-weight: 700; line-height: 1.5; min-height: 42px; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prod-price { font-size: 17px; color: var(--primary); font-weight: 900; letter-spacing: -0.5px; }
.prod-price .unit { font-size: 11px; font-weight: 500; color: var(--muted); }

/* SERVICES SECTION (differentiator!) */
.services-hero { position: relative; border-radius: 26px; overflow: hidden; min-height: 380px; margin-bottom: 30px; display: flex; align-items: center; padding: 46px 34px; color: white; }
.services-hero-bg { position: absolute; inset: 0; background-image: url('https://picsum.photos/seed/aytoobyaservices/1400/800'); background-size: cover; background-position: center; }
.services-hero-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(30,27,75,0.96) 0%, rgba(76,29,149,0.75) 60%, rgba(76,29,149,0.4) 100%); }
.services-hero-content { position: relative; z-index: 2; max-width: 560px; }
.services-hero-content .stag { display: inline-block; font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: 2px; margin-bottom: 14px; text-transform: uppercase; }
.services-hero-content h3 { font-size: clamp(26px, 4.5vw, 42px); font-weight: 900; letter-spacing: -1.2px; line-height: 1.15; margin-bottom: 14px; }
.services-hero-content p { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 24px; line-height: 1.8; }
.services-hero-content .sbtn { display: inline-flex; align-items: center; gap: 6px; background: white; color: var(--primary); padding: 12px 24px; border-radius: 100px; text-decoration: none; font-size: 14px; font-weight: 700; }
.services-hero-content .sbtn svg { width: 16px; height: 16px; }
.services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.service-tile { background: white; border-radius: 20px; padding: 22px 18px; text-decoration: none; color: var(--ink); border: 1px solid var(--line-dark); transition: all 0.3s; display: flex; flex-direction: column; gap: 12px; }
.service-tile:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: transparent; }
.service-tile-icon { width: 50px; height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
.service-tile-icon svg { width: 24px; height: 24px; color: white; }
.service-tile-title { font-size: 15px; font-weight: 800; }
.service-tile-sub { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
.service-tile-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; }
.service-tile-price { font-size: 13px; color: var(--primary); font-weight: 800; }
.service-tile-arrow { color: var(--muted); }

/* TRUST */
.trust { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 30px 0; }
.trust-item { text-align: center; padding: 24px 12px; }
.trust-item svg { width: 32px; height: 32px; color: var(--primary-2); margin-bottom: 12px; }
.section-dark .trust-item svg { color: var(--gold); }
.trust-item .t { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.trust-item .s { font-size: 12px; color: var(--muted); }
.section-dark .trust-item .s { color: rgba(255,255,255,0.5); }

/* AI ASSISTANT TEASER */
.ai-banner { position: relative; border-radius: 26px; overflow: hidden; padding: 50px 30px; background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #7c3aed 100%); color: white; text-align: center; margin: 40px 0; }
.ai-banner::before { content: ''; position: absolute; top: -50%; left: -20%; width: 70%; height: 200%; background: radial-gradient(circle, rgba(251,191,36,0.15), transparent 70%); }
.ai-banner::after { content: ''; position: absolute; bottom: -50%; right: -20%; width: 70%; height: 200%; background: radial-gradient(circle, rgba(168,85,247,0.3), transparent 70%); }
.ai-banner-content { position: relative; z-index: 1; }
.ai-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding: 7px 16px; border-radius: 30px; font-size: 11px; font-weight: 700; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
.ai-badge svg { width: 14px; height: 14px; color: var(--gold); }
.ai-banner h2 { font-size: clamp(24px, 4vw, 40px); font-weight: 900; letter-spacing: -1.2px; margin-bottom: 14px; line-height: 1.2; }
.ai-banner h2 .gold { color: var(--gold); }
.ai-banner p { font-size: 15px; color: rgba(255,255,255,0.85); max-width: 560px; margin: 0 auto 28px; line-height: 1.8; }
.ai-btn { display: inline-flex; align-items: center; gap: 8px; background: white; color: var(--primary); padding: 15px 32px; border-radius: 100px; text-decoration: none; font-size: 15px; font-weight: 700; }
.ai-btn svg { width: 18px; height: 18px; }

/* CTA SELLER */
.cta-seller { position: relative; border-radius: 26px; overflow: hidden; margin: 40px 0; padding: 46px 34px; color: white; min-height: 260px; display: flex; align-items: center; }
.cta-seller-bg { position: absolute; inset: 0; background-image: url('https://picsum.photos/seed/aytoobyaseller/1400/800'); background-size: cover; background-position: center; }
.cta-seller-overlay { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,15,0.96) 0%, rgba(10,10,15,0.7) 60%, transparent 100%); }
.cta-seller-content { position: relative; z-index: 2; max-width: 500px; }
.cta-seller-content .ctag { display: inline-block; font-size: 11px; font-weight: 800; color: var(--gold); letter-spacing: 2px; margin-bottom: 14px; text-transform: uppercase; }
.cta-seller-content h3 { font-size: clamp(24px, 4vw, 38px); font-weight: 900; letter-spacing: -1px; line-height: 1.15; margin-bottom: 12px; }
.cta-seller-content p { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 22px; line-height: 1.7; }
.cta-seller-content .cbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--gold); color: #78350f; padding: 13px 26px; border-radius: 100px; text-decoration: none; font-size: 14px; font-weight: 800; }
.cta-seller-content .cbtn svg { width: 16px; height: 16px; }

/* FOOTER */
.footer { background: #0a0a0f; color: rgba(255,255,255,0.55); padding: 60px 20px 30px; font-size: 12px; }
.footer-inner { max-width: 1200px; margin: 0 auto; }
.footer-grid { display: grid; grid-template-columns: 1fr; gap: 30px; padding-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; }
.footer-col h4 { color: white; font-size: 13px; margin-bottom: 14px; font-weight: 700; }
.footer-col ul { list-style: none; }
.footer-col li { margin-bottom: 8px; }
.footer-col a { color: rgba(255,255,255,0.55); text-decoration: none; transition: color 0.2s; }
.footer-col a:hover { color: white; }
.footer-brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.footer-brand-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #7c3aed, #4c1d95); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: white; }
.footer-brand-text { font-size: 16px; font-weight: 800; color: white; }
.footer-brand-text span { color: var(--gold); }
.footer-bottom { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: 11px; }

/* MOBILE NAV */
.mob-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,20,25,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; padding: 8px 0 10px; z-index: 900; }
.mob-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: rgba(255,255,255,0.5); padding: 4px 0; }
.mob-nav-item svg { width: 22px; height: 22px; }
.mob-nav-item span { font-size: 10px; font-weight: 600; }
.mob-nav-item.active { color: white; }
.mob-nav-item.active svg { color: var(--gold); }
.mob-nav-spacer { height: 76px; }

/* SKELETON */
.skeleton { background: linear-gradient(90deg, #f3f4f8 25%, #e5e7eb 50%, #f3f4f8 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

@media (min-width: 768px) {
  .nav-links { display: flex; }
  .nav-user { display: inline-flex; }
  .nav-cta { display: none; }
  .stats-inner { grid-template-columns: repeat(4, 1fr); }
  .featured-grid { grid-template-columns: repeat(2, 1fr); }
  .cats-grid { grid-template-columns: repeat(4, 1fr); }
  .products-grid { grid-template-columns: repeat(4, 1fr); }
  .services-grid { grid-template-columns: repeat(4, 1fr); }
  .footer-grid { grid-template-columns: 2fr 1fr 1fr 1fr; }
  .mob-nav { display: none; }
  .mob-nav-spacer { height: 0; }
}
</style>
</head>
