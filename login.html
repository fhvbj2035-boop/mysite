<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود / ثبت‌نام | بازارک</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: white; border-radius: 20px; padding: 35px 25px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.logo { text-align: center; font-size: 32px; font-weight: 700; color: #6d28d9; margin-bottom: 8px; }
.sub { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
.tabs { display: flex; background: #f3f4f6; border-radius: 12px; padding: 4px; margin-bottom: 25px; }
.tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 10px; font-weight: 500; color: #666; transition: all 0.2s; }
.tab.active { background: #6d28d9; color: white; }
.field { margin-bottom: 15px; }
label { display: block; font-size: 13px; color: #444; margin-bottom: 6px; font-weight: 500; }
input, select { width: 100%; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-family: inherit; font-size: 15px; transition: border 0.2s; }
input:focus, select:focus { outline: none; border-color: #6d28d9; }
.btn { width: 100%; padding: 14px; background: #6d28d9; color: white; border: none; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
.btn:hover { background: #5b21b6; }
.btn:disabled { background: #c4b5fd; cursor: not-allowed; }
.msg { padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 14px; text-align: center; display: none; }
.msg.err { background: #fee2e2; color: #b91c1c; display: block; }
.msg.ok { background: #dcfce7; color: #15803d; display: block; }
.hidden { display: none; }
.link { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
.link a { color: #6d28d9; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">بازارک</div>
  <div class="sub">بزرگ‌ترین بازارگاه کالا و خدمات ایران</div>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">ورود</div>
    <div class="tab" id="tabSignup" onclick="switchTab('signup')">ثبت‌نام</div>
  </div>

  <!-- فرم ورود -->
  <div id="formLogin">
    <div class="field">
      <label>ایمیل</label>
      <input type="email" id="loginEmail" placeholder="example@mail.com">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="loginPass" placeholder="••••••••">
    </div>
    <button class="btn" id="btnLogin" onclick="doLogin()">ورود به حساب</button>
  </div>

  <!-- فرم ثبت‌نام -->
  <div id="formSignup" class="hidden">
    <div class="field">
      <label>نام و نام خانوادگی</label>
      <input type="text" id="signupName" placeholder="مثلاً علی رضایی">
    </div>
    <div class="field">
      <label>ایمیل</label>
      <input type="email" id="signupEmail" placeholder="example@mail.com">
    </div>
    <div class="field">
      <label>رمز عبور (حداقل ۶ کاراکتر)</label>
      <input type="password" id="signupPass" placeholder="••••••••">
    </div>
    <div class="field">
      <label>نوع حساب</label>
      <select id="signupRole">
        <option value="buyer">خریدار</option>
        <option value="seller">فروشنده</option>
      </select>
    </div>
    <button class="btn" id="btnSignup" onclick="doSignup()">ساخت حساب</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="link">
    <a href="index.html">← بازگشت به صفحه اصلی</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArOOLrGn8wwj9-Hi0Ew1RBVNDxILnmBWs",
  authDomain: "myshop-82ab8.firebaseapp.com",
  projectId: "myshop-82ab8",
  storageBucket: "myshop-82ab8.firebasestorage.app",
  messagingSenderId: "307024397182",
  appId: "1:307024397182:web:54391f8a94d8f693dc692f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// اگر کاربر قبلاً وارد شده، برو به صفحه اصلی
onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = 'index.html';
});

window.switchTab = function(t) {
  document.getElementById('tabLogin').classList.toggle('active', t === 'login');
  document.getElementById('tabSignup').classList.toggle('active', t === 'signup');
  document.getElementById('formLogin').classList.toggle('hidden', t !== 'login');
  document.getElementById('formSignup').classList.toggle('hidden', t !== 'signup');
  document.getElementById('msg').className = 'msg';
};

function showMsg(text, type) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + type;
}

window.doLogin = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) { showMsg('ایمیل و رمز را وارد کنید', 'err'); return; }
  document.getElementById('btnLogin').disabled = true;
  document.getElementById('btnLogin').textContent = 'در حال ورود...';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    showMsg('✓ ورود موفق! در حال انتقال...', 'ok');
    setTimeout(() => window.location.href = 'index.html', 800);
  } catch (e) {
    let msg = 'خطا در ورود';
    if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') msg = 'ایمیل یا رمز اشتباه است';
    else if (e.code === 'auth/invalid-email') msg = 'ایمیل نامعتبر است';
    else if (e.code === 'auth/network-request-failed') msg = 'خطای شبکه - VPN را روشن کنید';
    else msg = e.message;
    showMsg('✗ ' + msg, 'err');
  } finally {
    document.getElementById('btnLogin').disabled = false;
    document.getElementById('btnLogin').textContent = 'ورود به حساب';
  }
};

window.doSignup = async function() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const pass = document.getElementById('signupPass').value;
  const role = document.getElementById('signupRole').value;
  if (!name || !email || !pass) { showMsg('همه فیلدها را پر کنید', 'err'); return; }
  if (pass.length < 6) { showMsg('رمز باید حداقل ۶ کاراکتر باشد', 'err'); return; }
  document.getElementById('btnSignup').disabled = true;
  document.getElementById('btnSignup').textContent = 'در حال ساخت...';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: name,
      email: email,
      role: role,
      createdAt: serverTimestamp()
    });
    showMsg('✓ ثبت‌نام موفق! در حال انتقال...', 'ok');
    setTimeout(() => window.location.href = 'index.html', 800);
  } catch (e) {
    let msg = 'خطا در ثبت‌نام';
    if (e.code === 'auth/email-already-in-use') msg = 'این ایمیل قبلاً ثبت شده است';
    else if (e.code === 'auth/invalid-email') msg = 'ایمیل نامعتبر است';
    else if (e.code === 'auth/weak-password') msg = 'رمز عبور ضعیف است';
    else if (e.code === 'auth/network-request-failed') msg = 'خطای شبکه - VPN را روشن کنید';
    else msg = e.message;
    showMsg('✗ ' + msg, 'err');
  } finally {
    document.getElementById('btnSignup').disabled = false;
    document.getElementById('btnSignup').textContent = 'ساخت حساب';
  }
};
</script>
</body>
</html>
