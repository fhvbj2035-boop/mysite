<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود / ثبت‌نام | AYTOOBYA</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 50%,#7c3aed 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:24px;padding:36px 26px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.logo-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#4c1d95);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;letter-spacing:-1px;position:relative;box-shadow:0 4px 15px rgba(124,58,237,.4)}
.logo-mark::after{content:'';position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#fbbf24;box-shadow:0 0 8px #fbbf24}
.logo-text{font-size:22px;font-weight:900;color:#0a0a0f;letter-spacing:.5px}
.logo-text span{color:#7c3aed}
.sub{text-align:center;color:#6b7280;margin-bottom:24px;font-size:13px}
.tabs{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:22px}
.tab{flex:1;text-align:center;padding:11px;cursor:pointer;border-radius:10px;font-weight:600;color:#666;transition:all .2s;font-size:14px}
.tab.active{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.field{margin-bottom:14px}
label{display:block;font-size:13px;color:#374151;margin-bottom:6px;font-weight:600}
input,select{width:100%;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-family:inherit;font-size:15px;transition:all .2s;background:#fafafa}
input:focus,select:focus{outline:none;border-color:#7c3aed;background:#fff;box-shadow:0 0 0 4px rgba(124,58,237,.1)}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;border:none;border-radius:12px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;transition:all .2s;box-shadow:0 6px 20px rgba(124,58,237,.3)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:12px;border-radius:10px;margin-top:14px;font-size:13px;text-align:center;display:none}
.msg.err{background:#fee2e2;color:#b91c1c;display:block}
.msg.ok{background:#dcfce7;color:#15803d;display:block}
.hidden{display:none}
.link{text-align:center;margin-top:20px;font-size:13px;color:#6b7280}
.link a{color:#7c3aed;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">AY</div>
    <div class="logo-text">AY<span>TOOBYA</span></div>
  </div>
  <div class="sub">بازارگاه هوشمند کالا و خدمات</div>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="switchTab('login')">ورود</div>
    <div class="tab" id="tabSignup" onclick="switchTab('signup')">ثبت‌نام</div>
  </div>

  <div id="formLogin">
    <div class="field"><label>ایمیل</label><input type="email" id="loginEmail" placeholder="example@mail.com"></div>
    <div class="field"><label>رمز عبور</label><input type="password" id="loginPass" placeholder="••••••••"></div>
    <button class="btn" id="btnLogin" onclick="doLogin()">ورود به حساب</button>
  </div>

  <div id="formSignup" class="hidden">
    <div class="field"><label>نام و نام خانوادگی</label><input type="text" id="signupName" placeholder="مثلاً علی رضایی"></div>
    <div class="field"><label>ایمیل</label><input type="email" id="signupEmail" placeholder="example@mail.com"></div>
    <div class="field"><label>رمز عبور (حداقل ۶ کاراکتر)</label><input type="password" id="signupPass" placeholder="••••••••"></div>
    <div class="field"><label>نوع حساب</label>
      <select id="signupRole">
        <option value="buyer">خریدار</option>
        <option value="seller">فروشنده</option>
        <option value="provider">ارائه‌دهنده خدمات</option>
      </select>
    </div>
    <button class="btn" id="btnSignup" onclick="doSignup()">ساخت حساب</button>
  </div>

  <div id="msg" class="msg"></div>
  <div class="link"><a href="index.html">← بازگشت به صفحه اصلی</a></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyArOOLrGn8wwj9-Hi0Ew1RBVNDxILnmBWs",
  authDomain: "myshop-82ab8.firebaseapp.com",
  projectId: "myshop-82ab8",
  storageBucket: "myshop-82ab8.firebasestorage.app",
  messagingSenderId: "307024397182",
  appId: "1:307024397182:web:54391f8a94d8f693dc692f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => { if (user) window.location.href = 'index.html'; });

window.switchTab = function(t) {
  document.getElementById('tabLogin').classList.toggle('active', t === 'login');
  document.getElementById('tabSignup').classList.toggle('active', t === 'signup');
  document.getElementById('formLogin').classList.toggle('hidden', t !== 'login');
  document.getElementById('formSignup').classList.toggle('hidden', t !== 'signup');
  document.getElementById('msg').className = 'msg';
};

function showMsg(t, type) {
  const m = document.getElementById('msg');
  m.textContent = t;
  m.className = 'msg ' + type;
}

window.doLogin = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) { showMsg('ایمیل و رمز را وارد کنید', 'err'); return; }
  const btn = document.getElementById('btnLogin');
  btn.disabled = true; btn.textContent = 'در حال ورود...';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    showMsg('✓ ورود موفق!', 'ok');
    setTimeout(() => window.location.href = 'index.html', 800);
  } catch (e) {
    let msg = 'خطا در ورود';
    if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') msg = 'ایمیل یا رمز اشتباه است';
    else if (e.code === 'auth/invalid-email') msg = 'ایمیل نامعتبر است';
    else if (e.code === 'auth/network-request-failed') msg = 'خطای شبکه';
    else msg = e.message;
    showMsg('✗ ' + msg, 'err');
    btn.disabled = false; btn.textContent = 'ورود به حساب';
  }
};

window.doSignup = async function() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const pass = document.getElementById('signupPass').value;
  const role = document.getElementById('signupRole').value;
  if (!name || !email || !pass) { showMsg('همه فیلدها را پر کنید', 'err'); return; }
  if (pass.length < 6) { showMsg('رمز باید حداقل ۶ کاراکتر باشد', 'err'); return; }
  const btn = document.getElementById('btnSignup');
  btn.disabled = true; btn.textContent = 'در حال ساخت...';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name, email, role, createdAt: serverTimestamp()
    });
    showMsg('✓ ثبت‌نام موفق!', 'ok');
    setTimeout(() => window.location.href = 'index.html', 800);
  } catch (e) {
    let msg = 'خطا در ثبت‌نام';
    if (e.code === 'auth/email-already-in-use') msg = 'این ایمیل قبلاً ثبت شده';
    else if (e.code === 'auth/invalid-email') msg = 'ایمیل نامعتبر است';
    else if (e.code === 'auth/weak-password') msg = 'رمز ضعیف است';
    else if (e.code === 'auth/network-request-failed') msg = 'خطای شبکه';
    else msg = e.message;
    showMsg('✗ ' + msg, 'err');
    btn.disabled = false; btn.textContent = 'ساخت حساب';
  }
};
</script>
</body>
</html>
